</style></head><body>
<header><h1>🧱 Блоксик</h1><button id="nh">Игры</button><button id="nc" class="p">＋ Создать</button></header>
<main id="m"></main><div id="ld"><div class="lg">🧱</div><h2>Блоксик</h2><div class="bar"><i id="lb"></i></div><small id="lt">Загрузка…</small></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=16,H=10,$=s=>document.querySelector(s),M=$('#m');

{id:'b1',genre:'c',title:'Лабиринт монет',author:'Блоксик',color:'#ffb300',bg:'#1b2a49',wall:'#3d5a9e',grid:["################","#s..o..#.....o.#","#.####.#.###.#.#","#.#..o...#o..#.#","#.#.#####.#.##.#","#...#...e.#....#","###.#.###.####.#","#o..#..o.....o.#","#.####.#####.e.#","################"]},
{id:'b2',genre:'p',title:'Прыг-скок до флага',author:'Блоксик',color:'#3ddc84',bg:'#173b4d',wall:'#5b7f3a',grid:["################","#..............#","#.............f#","#..........#####","#..............#","#......###.....#","#.......o...h..#","#...###....o...#","#s....^^...e...#","################"]},

const all=()=>base.concat(shared,mine).map(norm);
function parse(g){const cells=g.grid.map(r=>r.split('')),ents=[];let pl=null;
cells.forEach((r,y)=>r.forEach((c,x)=>{if(c==='e'){ents.push({x,y});r[x]='.'}if(c==='s'){pl={x,y};r[x]='.'}}));return{cells,ents,pl}}
function draw(ctx,g,s,cells,ents,pl){ctx.fillStyle=g.bg;ctx.fillRect(0,0,W*s,H*s);

let view='h',shared=[],db=null,uid=null,use3=ls('bv_3d',true),raf=0,P=null;const K={l:0,r:0,u:0,d:0,f:0};
const dir=()=>{const dx=K.r-K.l,dy=K.d-K.u;return dx?[dx,0]:dy?[0,dy]:null};

M.innerHTML='<p class="sub">'+(db?'🌍 Игры всех игроков в одном каталоге. ':'')+'Выбирай игру или создай свою: платформер, шутер или собиратель. Ты: <b>'+esc(nick)+'</b> <button id="rn" style="padding:3px 8px">ник</button></p><div class="grid">'+L.map((g,i)=>'<div class="card" data-i="'+i+'"><canvas width="160" height="100"></canvas><div><b>'+esc(g.title)+'</b><small>'+GN[g.genre||'c'].n+' · '+esc(g.author)+(g.shared?' 🌍':'')+'</small></div></div>').join('')+'</div>';
M.querySelectorAll('.card').forEach(el=>{const g=L[el.dataset.i],p=parse(g);draw(el.querySelector('canvas').getContext('2d'),g,10,p.cells,p.ents,p.pl);el.onclick=()=>play(g)});

function play(g){const p=parse(g);if(!p.pl){alert('В игре нет старта');return}

P={lives:1,inv:0,key:0,bo:0,g,gn,sp:[.75,1,1.4][(g.diff||2)-1],cells:p.cells,px:p.pl.x,py:p.pl.y,vy:0,gr:0,face:[1,0],bl:[],lf:0,got:0,lm:0,le:0,lt:0,t0:performance.now(),over:0,

P.left=gn==='s'?P.en.length:P.cells.flat().filter(c=>c==='o').length;
M.innerHTML='<div class="row"><button id="bk">← Назад</button><button id="t3"></button>'+(g.shared&&uid&&g.uid===uid?'<button id="dl">🗑</button>':'')+'<b style="align-self:center">'+esc(g.title)+'</b></div><div class="wrap"><canvas id="cv" width="512" height="320"></canvas><div class="ov" id="ov"></div></div><div class="hud"><span id="h1"></span><span id="h2"></span></div><div class="pad">'+(gn==='s'?'<button data-k="f">🔥</button>':'<span></span>')+'<button data-k="u">▲</button><span></span><button data-k="l">◀</button><button data-k="d">▼</button><button data-k="r">▶</button></div>';
$('#bk').onclick=home;$('#t3').textContent=use3?'3D: вкл':'3D: выкл';$('#t3').onclick=()=>{use3=!use3;sv('bv_3d',use3);play(P.g)};if($('#dl'))$('#dl').onclick=async()=>{if(confirm('Удалить твою игру из каталога?')){try{await db.collection('games').doc(g.id).delete()}catch(e){}home()}};
M.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{K[k]=0}});
P.s3=use3&&window.THREE?(()=>{try{return mk3()}catch(e){return null}})():null;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!'#t'.includes(P.cells[y][x])&&!(P.cells[y][x]==='d'&&!P.key);
const wp=(x,y)=>P.gn==='p'?[x+.5,H-y-.5,0]:[x+.5,.5,y+.5];
function kill3(){if(P&&P.s3){P.s3.r.dispose();P.s3.r.forceContextLoss();P.s3=null}}
function mk3(){const T=THREE,g=P.g,tp=P.gn==='p',r=new T.WebGLRenderer({canvas:$('#cv'),antialias:true}),col=c=>new T.Color(c),mat=c=>new T.MeshStandardMaterial({color:col(c)});
r.setSize(512,320,false);r.shadowMap.enabled=true;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(55,1.6,.1,60);sc.background=col(g.bg);sc.add(new T.HemisphereLight(0xffffff,0x445566,.85));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(12,16,14);dl.target.position.set(8,0,5);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:45});sc.add(dl,dl.target);
const fl=new T.Mesh(new T.PlaneGeometry(tp?40:16,tp?30:10),new T.MeshStandardMaterial({color:col(g.bg).offsetHSL(0,0,.07)}));
if(tp)fl.position.set(8,5,-.6);else{fl.rotation.x=-Math.PI/2;fl.position.set(8,0,5)}fl.receiveShadow=true;sc.add(fl);
const bx=(w,h,d,m)=>{const x=new T.Mesh(new T.BoxGeometry(w,h,d),m);x.castShadow=x.receiveShadow=true;return x};
const spr=ch=>{const cn=document.createElement('canvas');cn.width=cn.height=64;const x=cn.getContext('2d');x.font='48px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,32,34);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cn),transparent:true}));s.scale.set(.8,.8,.8);return s};
const bot=(c,ec,sz)=>{const o=new T.Group();o.add(bx(sz,sz,sz,mat(c)));[-1,1].forEach(i=>{const e=new T.Mesh(new T.BoxGeometry(.14,.14,.05),mat(ec));e.position.set(i*.18*sz/.8,.1,sz/2+.02);o.add(e)});return o};
const wm=mat(g.wall),it=[];
P.cells.forEach((row,y)=>row.forEach((c,x)=>{if(c==='.')return;let m;
if(c==='#')m=bx(1,1,1,wm);
else if(c==='o')m=new T.Mesh(new T.OctahedronGeometry(.3),mat('#ffd23f'));
else if(c==='^')m=new T.Mesh(new T.ConeGeometry(.4,.8,4),mat('#ff5252'));
else if(c==='f'){m=new T.Group();const f=bx(.5,.35,.06,mat('#ff9800'));f.position.set(.28,.3,0);m.add(bx(.08,1,.08,mat('#ddd')),f)}
else if(c==='d')m=bx(.9,1,.9,mat('#8d6e63'));
else if(c==='t')m=bx(1,1,1,mat('#43a047'));
else m=spr(IT[c]);
const w=wp(x,y);m.position.set(w[0],w[1],w[2]);sc.add(m);it.push({m,c,x,y})}));
const pl=bot(g.color,'#000',.8),en=P.en.map(e=>bot('#ff4d5e','#fff',.7)),bl=Array.from({length:12},()=>new T.Mesh(new T.SphereGeometry(.12,8,8),mat('#ffeb3b')));
let w=wp(P.px,P.py);pl.position.set(w[0],w[1],w[2]);en.forEach((m,i)=>{w=wp(P.en[i].x,P.en[i].y);m.position.set(w[0],w[1],w[2])});
sc.add(pl,...en,...bl);const w0=wp(P.px,P.py);cam.position.set(w0[0],8,w0[2]+5.5);
return{r,sc,cam,it,pl,en,bl}}
function r3(t,dt){const s=P.s3,tp=P.gn==='p',k=tp?1:Math.min(1,dt*14);
s.it.forEach(o=>{o.m.visible=P.cells[o.y][o.x]===o.c;if(o.c==='o')o.m.rotation.y=t/300});
const mv=(m,x,y)=>{const w=wp(x,y);m.position.x+=(w[0]-m.position.x)*k;m.position.y+=(w[1]-m.position.y)*k;m.position.z+=(w[2]-m.position.z)*k};
mv(s.pl,P.px,P.py);s.pl.visible=!(t<P.inv&&(t/100|0)%2);
s.en.forEach((m,i)=>{const e=P.en[i];m.visible=!!e;if(e)mv(m,e.x,e.y)});
s.bl.forEach((m,i)=>{const b=P.bl[i];m.visible=!!b;if(b){const w=wp(b.x,b.y);m.position.set(w[0],w[1],w[2])}});
if(tp){s.cam.position.set(8,5.6,12.5);s.cam.lookAt(8,4.4,0)}
else{const w=wp(P.px,P.py),c=s.cam;c.position.x+=(w[0]-c.position.x)*.1;c.position.z+=(w[2]+5.5-c.position.z)*.1;c.position.y=8;c.lookAt(c.position.x,0,c.position.z-5.5)}
s.r.render(s.sc,s.cam)}
function pick(x,y){const c=P.cells[y]&&P.cells[y][x];if(c==='h')P.lives=Math.min(3,P.lives+1);else if(c==='z')P.bo=performance.now()+5000;else if(c==='k')P.key=1;else if(c==='d')P.key=0;else return;P.cells[y][x]='.'}
const solid=(x,y)=>{const cx=Math.floor(x),cy=Math.floor(y);return cx<0||cx>=W||(cy>=0&&cy<H&&('#t'.includes(P.cells[cy][cx])||(P.cells[cy][cx]==='d'&&!P.key)))};
const hit=(x,y)=>solid(x+.12,y+.1)||solid(x+.88,y+.1)||solid(x+.12,y+.9)||solid(x+.88,y+.9);
function end(win){if(!win&&P.lives>1){const n=performance.now();if(n>P.inv){P.lives--;P.inv=n+1500}return}P.over=1;const s=((performance.now()-P.t0)/1000).toFixed(1),o=$('#ov');o.style.display='flex';
o.innerHTML='<div>'+(win?'🎉 Победа! '+s+' с':'💥 Проигрыш')+'</div><div class="row"><button class="p" id="ag">Заново</button><button id="bk2">В каталог</button></div>';
$('#ag').onclick=()=>play(P.g);$('#bk2').onclick=home}
function tc(t){const h=dir();
if(h&&t-P.lm>(t<P.bo?65:130)){const nx=P.px+h[0],ny=P.py+h[1];if(free(nx,ny)){P.px=nx;P.py=ny;P.lm=t;pick(nx,ny);if(P.cells[ny][nx]==='o'){P.cells[ny][nx]='.';P.left--}}}
if(t-P.le>260/P.sp){P.le=t;P.en.forEach(e=>{if(!free(e.x+e.dx,e.y+e.dy)){e.dx*=-1;e.dy*=-1}if(free(e.x+e.dx,e.y+e.dy)){e.x+=e.dx;e.y+=e.dy}})}

if(!P.left)end(1)}
function ts(t,dt){const h=dir();
if(h){P.face=h;if(t-P.lm>(t<P.bo?65:130)){const nx=P.px+h[0],ny=P.py+h[1];if(free(nx,ny)){P.px=nx;P.py=ny;P.lm=t;pick(nx,ny)}}}
if(K.f&&t-P.lf>280){P.lf=t;P.bl.push({x:P.px,y:P.py,dx:P.face[0],dy:P.face[1]})}
P.bl=P.bl.filter(b=>{b.x+=b.dx*12*dt;b.y+=b.dy*12*dt;if(!free(Math.round(b.x),Math.round(b.y)))return 0;
const i=P.en.findIndex(e=>Math.abs(e.x-b.x)<.6&&Math.abs(e.y-b.y)<.6);if(i<0)return 1;P.en.splice(i,1);P.left--;return 0});
if(t-P.le>520/P.sp){P.le=t;P.en.forEach(e=>{const dx=Math.sign(P.px-e.x),dy=Math.sign(P.py-e.y),a=Math.abs(P.px-e.x)>Math.abs(P.py-e.y)?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];for(const[mx,my]of a)if((mx||my)&&free(e.x+mx,e.y+my)){e.x+=mx;e.y+=my;break}})}

if(!P.left)end(1)}
function tp(t,dt){const p=P;p.vy=Math.min(p.vy+32*dt,18);const vx=(K.r-K.l)*(t<P.bo?8:5);
if(K.u&&p.gr){p.vy=-12.5;p.gr=0}

p.py+=p.vy*dt;p.gr=0;

P.en.forEach(e=>{e.x+=e.dx*2*P.sp*dt;const fx=e.x+.5+e.dx*.5;if(solid(fx,e.y+.5)||!solid(fx,e.y+1.2))e.dx*=-1});
for(let i=P.en.length;i--;){const e=P.en[i];if(Math.abs(e.x-p.px)<.7&&Math.abs(e.y-p.py)<.7){if(p.vy>0&&p.py<e.y-.2){P.en.splice(i,1);p.vy=-8}else return end(0)}}
const cx=Math.floor(p.px+.5),cy=Math.floor(p.py+.5),c=P.cells[cy]&&P.cells[cy][cx];
